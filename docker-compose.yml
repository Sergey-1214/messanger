services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messenger}
      POSTGRES_USER: ${POSTGRES_USER:-messenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messenger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth_service:
    build:
      context: ./auth_service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-messenger}:${POSTGRES_PASSWORD:-messenger}@postgres:5432/${POSTGRES_DB:-messenger}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    ports:
      - "${AUTH_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  message_service:
    build:
      context: ./message_service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-messenger}:${POSTGRES_PASSWORD:-messenger}@postgres:5432/${POSTGRES_DB:-messenger}
      AUTH_SERVICE_URL: http://auth_service:8000
    ports:
      - "${MESSAGE_SERVICE_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      auth_service:
        condition: service_started
    restart: unless-stopped

  realtime_gateway:
    build:
      context: ./realtime_gateway
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      MESSAGE_SERVICE_URL: http://message_service:8000
    ports:
      - "${REALTIME_GATEWAY_PORT:-8002}:8000"
    depends_on:
      message_service:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
