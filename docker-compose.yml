services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messenger}
      POSTGRES_USER: ${POSTGRES_USER:-messenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messenger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth_service:
    build:
      context: ./auth_service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-messenger}:${POSTGRES_PASSWORD:-messenger}@postgres:5432/${POSTGRES_DB:-messenger}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    ports:
      - "${AUTH_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  message_service:
    build:
      context: ./message_service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-messenger}:${POSTGRES_PASSWORD:-messenger}@postgres:5432/${POSTGRES_DB:-messenger}
      AUTH_SERVICE_URL: http://auth_service:8000
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app-password}@rabbitmq:5672/
    ports:
      - "${MESSAGE_SERVICE_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      auth_service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  realtime_gateway:
    build:
      context: ./realtime_gateway
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      MESSAGE_SERVICE_URL: http://message_service:8000
      PRESENCE_SERVICE_URL: http://presence_service:8000
      PRESENCE_HEARTBEAT_INTERVAL_SECONDS: ${PRESENCE_HEARTBEAT_INTERVAL_SECONDS:-20}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app-password}@rabbitmq:5672/
    ports:
      - "${REALTIME_GATEWAY_PORT:-8002}:8000"
    depends_on:
      message_service:
        condition: service_started
      presence_service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  presence_service:
    build:
      context: ./presence_service
    environment:
      REDIS_URL: redis://presence_redis:6379/0
      REDIS_MAX_CONNECTIONS: ${PRESENCE_REDIS_MAX_CONNECTIONS:-50}
      PRESENCE_CONNECTION_TTL_SECONDS: ${PRESENCE_CONNECTION_TTL_SECONDS:-60}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app-password}@rabbitmq:5672/
    ports:
      - "${PRESENCE_SERVICE_PORT:-8003}:8000"
    depends_on:
      presence_redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  presence_redis:
    image: redis:8-alpine
    ports:
      - "${PRESENCE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app-password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
