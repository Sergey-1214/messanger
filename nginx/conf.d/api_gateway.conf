#   /auth/*      -> auth_service:8000     (REST; register/login/refresh public,
#                                           logout self-validates Authorization)
#   /chats/*     -> message_service:8000  (REST; protected -> User-Id header)
#   /messages/*  -> message_service:8000  (REST; protected -> User-Id header)
#   /ws          -> realtime_gateway:8000 (WebSocket)
#   /user/*      -> user_service:8000     (REST; user_service verifies JWT itself)
#   /settings/*  -> user_service:8000     (REST; user_service verifies JWT itself)

upstream auth_service {
    server auth_service:8000;
    keepalive 32;
}

upstream message_service {
    server message_service:8000;
    keepalive 32;
}

upstream realtime_gateway {
    server realtime_gateway:8000;
    keepalive 32;
}

upstream user_service {
    server user_service:8000;
    keepalive 32;
}


map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    add_header Access-Control-Allow-Origin  "http://localhost:8000" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
    add_header Access-Control-Max-Age 86400 always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /_auth/verify {
        internal;
        proxy_pass http://auth_service/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
    }

    location ~ ^/auth/(verify|users)(/|$) {
        return 404;
    }

    location /auth/ {
        limit_req  zone=auth_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://auth_service;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /chats {
        limit_req zone=general_limit burst=50 nodelay;

        auth_request /_auth/verify;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_pass http://message_service;
        proxy_http_version 1.1;
        proxy_set_header User-Id           $user_id;
        proxy_set_header Authorization     "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /messages {
        limit_req zone=general_limit burst=50 nodelay;

        auth_request /_auth/verify;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_pass http://message_service;
        proxy_http_version 1.1;
        proxy_set_header User-Id           $user_id;
        proxy_set_header Authorization     "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location ~ ^/user/?$ {
        return 404;
    }

    location /user {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /settings {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /ws {
        proxy_pass http://realtime_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    location / {
        return 404;
    }
}
